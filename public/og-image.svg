<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5e4a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a96e"/>
      <stop offset="100%" style="stop-color:#e8d5a8"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- 装饰线条 -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#c8a96e" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#c8a96e" stroke-width="0.5" opacity="0.3"/>
  
  <!-- 左侧圆形装饰 -->
  <circle cx="150" cy="315" r="80" fill="none" stroke="#c8a96e" stroke-width="2" opacity="0.2"/>
  <circle cx="150" cy="315" r="50" fill="none" stroke="#c8a96e" stroke-width="1" opacity="0.15"/>
  
  <!-- Logo 文字 -->
  <text x="150" y="325" text-anchor="middle" fill="#c8a96e" font-size="60" font-family="sans-serif" font-weight="bold">無</text>
  
  <!-- 主标题 -->
  <text x="600" y="240" text-anchor="middle" fill="white" font-size="52" font-family="sans-serif" font-weight="bold">无疾科技</text>
  <text x="600" y="310" text-anchor="middle" fill="#c8a96e" font-size="28" font-family="sans-serif">数字中医 · 减熵系统</text>
  
  <!-- 副标题 -->
  <text x="600" y="380" text-anchor="middle" fill="#aaa" font-size="20" font-family="sans-serif">为生命体注入负熵，从无序回归有序</text>
  
  <!-- 底部信息 -->
  <text x="600" y="480" text-anchor="middle" fill="#888" font-size="16" font-family="sans-serif">三唯框架：物质 · 信息能量 · 意识</text>
  
  <!-- 网址 -->
  <text x="600" y="560" text-anchor="middle" fill="#c8a96e" font-size="22" font-family="sans-serif">wuji.tech</text>
</svg>
